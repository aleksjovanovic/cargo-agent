components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    XRateLimitLimit:
      description: Total number of requests allowed in the current window
      schema: { type: integer, example: 60 }
    XRateLimitRemaining:
      description: Remaining number of requests in the current window
      schema: { type: integer, example: 42 }
    RetryAfter:
      description: Seconds until the next window (only present on 429)
      schema: { type: integer, example: 30 }

  responses:
    TooManyRequests:
      description: Too many requests
      headers:
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            limited:
              value:
                error: rate_limited
                message: Too many requests. Please try again later.
                details: null

  schemas:
    HealthCheckResponse:
      type: object
      properties:
        message:
          type: string
          example: Server is OK
      required: [message]

    ReadyzSuccessResponse:
      type: object
      properties:
        message: { type: string, example: ready }
        data:
          type: object
          properties:
            db:
              type: object
              properties:
                ok: { type: boolean, example: true }
            redis:
              type: object
              properties:
                ok: { type: boolean, example: true }
      required: [message, data]

    ReadyzErrorResponse:
      type: object
      properties:
        error: { type: string, example: not_ready }
        message: { type: string, example: dependencies not ready }
        details:
          type: object
          properties:
            db:
              type: object
              properties:
                ok: { type: boolean, example: false }
            redis:
              type: object
              properties:
                ok: { type: boolean, example: true }
      required: [error, message]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: demo }
        password: { type: string, format: password, example: DemoPass123! }

    LoginSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: Login successful }
        data:
          type: object
          required: [token]
          properties:
            token:
              type: string
              description: JWT access token
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password, example: DemoPass123! }
        new_password: { type: string, format: password, example: NewStrong!234 }

    CreateUserRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, example: johndoe }
        email: { type: string, format: email, example: john.doe@example.com }
        password: { type: string, format: password, example: StrongPass!23 }
        name: { type: string, example: John Doe }
        country: { type: string, example: RS }
        city: { type: string, example: Nis }
        legal_address: { type: string, example: "Some street 10, 18000 Nis" }
        vat_number: { type: string, example: "RS123456789" }
        language: { type: string, example: en }

    CreateUserSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: User created successfully }
        data: { $ref: '#/components/schemas/User' }

    UpdateUserProfileRequest:
      type: object
      description: At least one field must be provided. Omitted fields are not changed.
      properties:
        username: { type: string, example: newusername }
        email: { type: string, format: email, example: new.email@example.com }
        name: { type: string, example: New Name }
        country: { type: string, example: RS }
        city: { type: string, example: Nis }
        legal_address: { type: string, example: "Some street 10, 18000 Nis" }
        vat_number: { type: string, example: "RS123456789" }
        language: { type: string, example: en }

    User:
      type: object
      required: [id, username, email, status]
      properties:
        id: { type: integer, format: int32, example: 123 }
        username: { type: string, example: demo }
        email: { type: string, format: email, example: demo@example.com }
        name: { type: string, example: Demo User }
        country: { type: string, example: RS }
        city: { type: string, example: Nis }
        legal_address: { type: string, example: "Some street 10, 18000 Nis" }
        vat_number: { type: string, example: "RS123456789" }
        status:
          type: string
          description: User status (e.g., active, inactive, suspended, deleted, draft)
          example: active
        language: { type: string, example: en }
        created: { type: string, format: date-time, nullable: true }
        updated: { type: string, format: date-time, nullable: true }

    UserProfileSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/User' }

    Country:
      type: object
      required: [id, name, code, alpha3_code]
      properties:
        id: { type: integer, format: int32, example: 1 }
        name: { type: string, example: Serbia }
        code: { type: string, example: RS }
        alpha3_code: { type: string, example: SRB }
        eu_member: { type: boolean, nullable: true, example: false }
        continent: { type: string, nullable: true, example: Europe }

    CountriesListSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: success }
        data:
          type: array
          items: { $ref: '#/components/schemas/Country' }

    CountrySuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/Country' }

    City:
      type: object
      required: [id, name, country_id, latitude, longitude]
      properties:
        id: { type: integer, format: int32, example: 10 }
        name: { type: string, example: Belgrade }
        country_id: { type: integer, format: int32, example: 1 }
        latitude: { type: string, example: 11.11111 }
        longitude: { type: string, example: 22.22222 }

    CitiesListByCountrySuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: success }
        data:
          type: array
          items: { $ref: '#/components/schemas/City' }

    DeleteUserSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: "Operation successful" }
        data: { nullable: true, example: null }

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: invalid_payload }
        message: { type: string, example: Invalid request payload }
        details: { nullable: true }

    CreateCargoOfferRequest:
      type: object
      required:
        - origin_country_id
        - origin_city_id
        - destination_country_id
        - destination_city_id
        - loading_places
        - unloading_places
        - ready_to_load_by
        - delivery_deadline
        - load_type
        - truck_type
        - weight_t
      properties:
        origin_country_id:      { type: integer, format: int32, example: 29 }
        origin_city_id:         { type: integer, format: int32, example: 1 }
        destination_country_id: { type: integer, format: int32, example: 45 }
        destination_city_id:    { type: integer, format: int32, example: 1 }
        loading_places:         { type: integer, format: int32, example: 1 }
        unloading_places:       { type: integer, format: int32, example: 1 }
        ready_to_load_by:       { type: string, format: date-time, example: "2025-09-02T08:00:00Z" }
        delivery_deadline:      { type: string, format: date-time, example: "2025-09-05T18:00:00Z" }
        load_type:              { type: string, enum: [ftl, ltl] }
        truck_type:             { type: string, enum: [refrigerator, curtain, box, flatbed, tanker, container, other] }
        weight_t:               { type: number, format: float, example: 24.0 }
        volume_m3:              { type: number, format: float, nullable: true, example: 82.0 }
        pallets:                { type: integer, format: int32, nullable: true, example: 33 }
        palletized:             { type: boolean, example: true }
        temperature_min_c:      { type: number, format: float, nullable: true, example: -2.0 }
        temperature_max_c:      { type: number, format: float, nullable: true, example: 4.0 }
        published_at:           { type: string, format: date-time, nullable: true }
        expires_at:             { type: string, format: date-time, nullable: true }
        price:                  { type: number, format: float, nullable: true, example: 1200.00 }
        currency:               { type: string, nullable: true, example: EUR }
        notes:                  { type: string, nullable: true, example: "On pallets, rear loading only." }

    CargoOffer:
      type: object
      required: [id]
      properties:
        id: { type: integer, format: int32 }

    CargoOfferSuccessResponse:
      type: object
      required: [message, data]
      properties:
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/CargoOffer' }

    TruckAvailability:
      type: object
      properties:
        id: { type: integer, format: int32 }
        created_by: { type: integer, format: int32 }
        start_country_id: { type: integer, format: int32 }
        start_city_id: { type: integer, format: int32 }
        end_country_id: { type: integer, format: int32, nullable: true }
        end_city_id: { type: integer, format: int32, nullable: true }
        available_from: { type: string, format: date-time }
        available_to: { type: string, format: date-time }
        truck_type:
          type: string
          enum: [refrigerator, curtain, box, flatbed, tanker, container, other]
        max_weight_t: { type: number, format: float }
        max_volume_m3: { type: number, format: float, nullable: true }
        full_load: { type: boolean }
        partial_load: { type: boolean }
        loading_places: { type: integer, format: int32 }
        unloading_places: { type: integer, format: int32 }
        published_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        poster_name: { type: string }
        price_per_km: { type: number, format: float, nullable: true }
        currency: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [published, draft, cancelled, expired, closed]
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    CreateTruckAvailabilityRequest:
      type: object
      required:
        - start_country_id
        - start_city_id
        - available_from
        - available_to
        - truck_type
        - max_weight_t
        - full_load
        - partial_load
        - loading_places
        - unloading_places
      properties:
        start_country_id: { type: integer, format: int32 }
        start_city_id: { type: integer, format: int32 }
        end_country_id: { type: integer, format: int32, nullable: true }
        end_city_id: { type: integer, format: int32, nullable: true }
        available_from: { type: string, format: date-time }
        available_to: { type: string, format: date-time }
        truck_type:
          type: string
          enum: [refrigerator, curtain, box, flatbed, tanker, container, other]
        max_weight_t: { type: number, format: float }
        max_volume_m3: { type: number, format: float, nullable: true }
        full_load: { type: boolean }
        partial_load: { type: boolean }
        loading_places: { type: integer, format: int32 }
        unloading_places: { type: integer, format: int32 }
        expires_at: { type: string, format: date-time, nullable: true }
        price_per_km: { type: number, format: float, nullable: true }
        currency: { type: string, nullable: true, example: EUR }
        notes: { type: string, nullable: true }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: demo@example.com

    PasswordResetConfirmRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: Password reset token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        new_password:
          type: string
          format: password
          example: NewStrong!234