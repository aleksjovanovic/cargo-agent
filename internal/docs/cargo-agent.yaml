openapi: 3.0.3
info:
  title: Cargo Agent API
  version: 1.0.0
  description: |
    Cargo Agent is an API designed to help logistics companies and freight forwarders.
    It provides functionality for discovering optimal transport routes for carriers,
    as well as finding available carriers for transporting cargo.
    This API simplifies the process of matching freight with carriers, improving efficiency
    and reducing the complexity of cargo transportation management.

servers:
  - url: http://localhost:8081/cargo-agent/v1

paths:
  /health-check:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns a simple OK message to indicate the server is healthy.
      operationId: getHealthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                ok:
                  value:
                    message: Server is OK

  /users/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticates a user with username and password and returns a JWT token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              sample:
                value:
                  username: demo
                  password: DemoPass123!
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
              examples:
                ok:
                  value:
                    message: Login successful
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid request payload or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/signup:
    post:
      tags:
        - Auth
      summary: Sign up
      description: Creates a new user account.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              sample:
                value:
                  username: johndoe
                  email: john.doe@example.com
                  password: StrongPass!23
                  name: John Doe
                  country: RS
                  city: Nis
                  legal_address: "Some street 10, 18000 Nis"
                  vat_number: "RS123456789"
                  language: en
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSuccessResponse'
              examples:
                created:
                  value:
                    message: User created successfully
                    data:
                      id: 101
                      username: johndoe
                      email: john.doe@example.com
                      name: John Doe
                      country: RS
                      city: Nis
                      legal_address: "Some street 10, 18000 Nis"
                      vat_number: "RS123456789"
                      status: active
                      language: en
                      created: "2025-08-29T09:30:00Z"
                      updated: "2025-08-29T09:30:00Z"
        '400':
          description: Invalid request payload or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  value:
                    error: invalid_payload
                    message: Invalid request payload
                    details: null
                bad_request:
                  value:
                    error: bad_request
                    message: "username is required"
                    details: null
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                username_exists:
                  value:
                    error: username_exists
                    message: Username already exists
                    details: null
                email_exists:
                  value:
                    error: email_exists
                    message: Email already exists
                    details: null
        '500':
          description: Internal error while creating user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                transaction_start_failed:
                  value:
                    error: transaction_start_failed
                    message: Failed to start transaction
                    details: null
                password_hash_failed:
                  value:
                    error: password_hash_failed
                    message: Failed to hash password
                    details: null
                user_creation_failed:
                  value:
                    error: user_creation_failed
                    message: Failed to create user
                    details: null
                transaction_commit_failed:
                  value:
                    error: transaction_commit_failed
                    message: Failed to commit transaction
                    details: null

  /users/verify-email:
    get:
      tags:
        - Auth
      summary: Verify email
      description: Confirms a user's email using a verification token. This endpoint is public.
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: Verification token from the email link
          schema:
            type: string
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserSuccessResponse'
              examples:
                ok:
                  value:
                    message: Email verified successfully
                    data: null
        '400':
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_token:
                  value:
                    error: invalid_token
                    message: Token is required
                    details: null
        '410':
          description: Token expired (gone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                token_expired:
                  value:
                    error: token_expired
                    message: Token has expired
                    details: null
        '500':
          description: Server or database error during verification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags:
        - User
      summary: Get current user's profile
      description: Returns the authenticated user's profile. Requires a valid JWT token.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
              examples:
                sample:
                  value:
                    message: success
                    data:
                      id: 123
                      username: demo
                      email: demo@example.com
                      name: Demo User
                      country: RS
                      city: Nis
                      legal_address: "Some street 10, 18000 Nis"
                      vat_number: "RS123456789"
                      status: active
                      language: en
                      created: "2025-08-21T10:15:30Z"
                      updated: "2025-08-28T09:45:00Z"
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: User not found
                    details: null

    patch:
      tags:
        - User
      summary: Update current user's profile
      description: Partially updates the authenticated user's profile. At least one field must be provided. Requires a valid JWT token.
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
            examples:
              sample_partial:
                value:
                  name: "New Name"
                  city: "Novi Sad"
              sample_full:
                value:
                  username: "newusername"
                  email: "new.email@example.com"
                  name: "New Name"
                  country: "RS"
                  city: "Nis"
                  legal_address: "Some street 10, 18000 Nis"
                  vat_number: "RS123456789"
                  language: "en"
      responses:
        '201':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
              examples:
                ok:
                  value:
                    message: User profile updated successfully
                    data:
                      id: 123
                      username: newusername
                      email: new.email@example.com
                      name: New Name
                      country: RS
                      city: Nis
                      legal_address: "Some street 10, 18000 Nis"
                      vat_number: "RS123456789"
                      status: active
                      language: en
                      created: "2025-08-21T10:15:30Z"
                      updated: "2025-08-29T10:30:00Z"
        '400':
          description: Invalid payload, validation failed, or no fields to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  value:
                    error: invalid_payload
                    message: Invalid request payload
                    details: null
                bad_request:
                  value:
                    error: bad_request
                    message: "username must be between 3 and 150 characters long"
                    details: null
                no_changes:
                  value:
                    error: no_changes
                    message: No fields to update.
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                username_exists:
                  value:
                    error: username_exists
                    message: Username already exists
                    details: null
                email_exists:
                  value:
                    error: email_exists
                    message: Email already exists
                    details: null
        '500':
          description: Update failed (database or server error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user_update_failed:
                  value:
                    error: user_update_failed
                    message: Failed to update user profile
                    details: null
                transaction_commit_failed:
                  value:
                    error: transaction_commit_failed
                    message: Failed to commit transaction
                    details: null

  /users/me/password:
    put:
      tags:
        - User
        - Auth
      summary: Change current user's password
      description: Requires a valid JWT token and the correct old password.
      operationId: changeMyPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              sample:
                value:
                  old_password: "DemoPass123!"
                  new_password: "NewStrong!234"
      responses:
        '200':
          description: Password updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserSuccessResponse'
              examples:
                ok:
                  value:
                    message: Password updated successfully
                    data: null
        '400':
          description: Invalid payload or weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_payload:
                  value:
                    error: invalid_payload
                    message: Invalid request payload
                    details: null
                bad_request:
                  value:
                    error: bad_request
                    message: "new password must be at least 8 characters long"
                    details: null
        '401':
          description: Unauthorized or invalid old password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
                invalid_old_password:
                  value:
                    error: invalid_old_password
                    message: Old password is incorrect
                    details: null
        '500':
          description: Internal error while changing password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                password_hash_failed:
                  value:
                    error: password_hash_failed
                    message: Failed to hash new password
                    details: null
                pasword_update_failed:
                  value:
                    error: pasword_update_failed
                    message: Failed to change password
                    details: null

  /users/{id}:
    delete:
      tags:
        - User
      summary: Soft delete user
      description: Marks the user as deleted (soft delete via status) and updates the timestamp.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (integer)
          schema:
            type: integer
            format: int32
          example: 42
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserSuccessResponse'
              examples:
                ok:
                  value:
                    message: User deleted successfully
                    data: null
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_id:
                  value:
                    error: invalid_id
                    message: ID must be a valid integer
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '500':
          description: Delete failed (database or server error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                delete_user_failed:
                  value:
                    error: delete_user_failed
                    message: Failed to delete user
                    details: null

  /countries:
    get:
      tags:
        - Country
      summary: List countries
      description: Returns a list of countries. Requires a valid JWT token.
      operationId: listCountries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Countries loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesListSuccessResponse'
              examples:
                from_cache:
                  value:
                    message: success (from cache/redis)
                    data:
                      - id: 15
                        name: Germany
                        code: DE
                        alpha3_code: DEU
                        eu_member: true
                        continent: Europe
                      - id: 36
                        name: Serbia
                        code: RS
                        alpha3_code: SRB
                        eu_member: false
                        continent: Europe
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: Countries not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: Countries not found
                    details: null

  /countries/{id}:
    get:
      tags:
        - Country
      summary: Get country by ID
      description: Returns a single country by its ID. Requires a valid JWT token.
      operationId: getCountryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Country ID (integer)
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        '200':
          description: Country loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountrySuccessResponse'
              examples:
                sample:
                  value:
                    message: success
                    data:
                      id: 36
                      name: Serbia
                      code: RS
                      alpha3_code: SRB
                      eu_member: false
                      continent: Europe
                from_cache:
                  value:
                    message: success (from cache/redis)
                    data:
                      id: 36
                      name: Serbia
                      code: RS
                      alpha3_code: SRB
                      eu_member: false
                      continent: Europe
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_id:
                  value:
                    error: invalid_id
                    message: ID must be a valid integer
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: Country not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: Country not found
                    details: null

  /countries/name/{name}:
    get:
      tags:
        - Country
      summary: Get country by name
      description: Returns a single country by its name. Requires a valid JWT token.
      operationId: getCountryByName
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Country name (string)
          schema:
            type: string
          example: Serbia
      responses:
        '200':
          description: Country loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountrySuccessResponse'
              examples:
                sample:
                  value:
                    message: success
                    data:
                      id: 36
                      name: Serbia
                      code: RS
                      alpha3_code: SRB
                      eu_member: false
                      continent: Europe
        '400':
          description: Invalid name (empty or only whitespace)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_name:
                  value:
                    error: invalid_name
                    message: Country name cannot be empty
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: Country not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: Country not found
                    details: null

  /countries/id/{id}/cities:
    get:
      tags:
        - Country
        - City
      summary: List cities by country ID
      description: Returns a list of cities for the given country ID. Requires a valid JWT token.
      operationId: listCitiesByCountryId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Country ID (integer)
          schema:
            type: integer
            format: int32
          example: 1
      responses:
        '200':
          description: Cities loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesListByCountrySuccessResponse'
              examples:
                from_cache:
                  value:
                    message: success (from cache/redis)
                    data:
                      - id: 36
                        name: Belgrade
                        country_id: 36
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_id:
                  value:
                    error: invalid_id
                    message: ID must be a valid integer
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: Cities not found for the specified ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: Cities not found
                    details: null

  /countries/name/{name}/cities:
    get:
      tags:
        - Country
        - City
      summary: List cities by country name
      description: Returns a list of cities for the given country name. Requires a valid JWT token.
      operationId: listCitiesByCountryName
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Country name (string)
          schema:
            type: string
          example: Serbia
      responses:
        '200':
          description: Cities loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitiesListByCountrySuccessResponse'
              examples:
                from_cache:
                  value:
                    message: success
                    data:
                      - id: 36
                        name: Belgrade
                        country_id: 36
        '400':
          description: Invalid name (must be a non-empty string)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_id:
                  value:
                    error: invalid_name
                    message: Country name cannot be empty
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unauthorized:
                  value:
                    error: unauthorized
                    message: Please log in to continue
                    details: null
        '404':
          description: Cities not found for the specified country name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  value:
                    error: not_found
                    message: Cities not found
                    details: null

  /cargo-offers:
    post:
      tags: [CargoOffers]
      summary: Create a cargo offer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCargoOfferRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoOfferSuccessResponse'
        '400':
          description: Invalid payload / validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /cargo-offers/{id}:
    get:
      tags: [CargoOffers]
      summary: Get cargo offer by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoOfferSuccessResponse'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }           
      
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthCheckResponse:
      type: object
      properties:
        message:
          type: string
          example: Server is OK
      required:
        - message

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: demo
        password:
          type: string
          format: password
          example: DemoPass123!

    LoginSuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
        message:
          type: string
          example: Login successful
        data:
          type: object
          required:
            - token
          properties:
            token:
              type: string
              description: JWT access token
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          format: password
          example: DemoPass123!
        new_password:
          type: string
          format: password
          example: NewStrong!234

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: johndoe
        email:
          type: string
          format: email
          example: john.doe@example.com
        password:
          type: string
          format: password
          example: StrongPass!23
        name:
          type: string
          example: John Doe
        country:
          type: string
          example: RS
        city:
          type: string
          example: Nis
        legal_address:
          type: string
          example: "Some street 10, 18000 Nis"
        vat_number:
          type: string
          example: "RS123456789"
        language:
          type: string
          example: en

    CreateUserSuccessResponse:
      type: object
      required:
        - message
        - data
      properties:
