openapi: 3.0.3
info:
  title: Cargo Agent API
  version: 1.0.0
  description: |
    Cargo Agent is an API designed to help logistics companies and freight forwarders.
    It provides functionality for discovering optimal transport routes for carriers,
    as well as finding available carriers for transporting cargo.
    This API simplifies the process of matching freight with carriers, improving efficiency
    and reducing the complexity of cargo transportation management.

    ---
    ### Rate limiting
    Unless stated otherwise, endpoints are rate-limited (default **60 req/min** per user or IP).
    When applicable, responses include the following headers:
    - **X-RateLimit-Limit**: total requests allowed in the current window
    - **X-RateLimit-Remaining**: remaining requests in the current window
    - **Retry-After**: seconds until next window (only when `429`)

servers:
  - url: http://localhost:8081/cargo-agent/v1
  - url: http://localhost:8081

paths:
  /health-check:
    get:
      tags: [Health]
      summary: Health check
      description: Returns a simple OK message to indicate the server is healthy.
      operationId: getHealthCheck
      responses:
        '200':
          description: Server is healthy
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
              examples:
                ok:
                  value:
                    message: Server is OK
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe (DB + Redis)
      description: Returns readiness of core dependencies. 200 when DB and Redis are reachable; 503 otherwise.
      operationId: getReadyz
      servers:
        - url: http://localhost:8081
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyzSuccessResponse' }
              examples:
                ready:
                  value:
                    message: ready
                    data:
                      db: { ok: true }
                      redis: { ok: true }
        '503':
          description: Not ready (one or more dependencies unavailable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadyzErrorResponse' }
              examples:
                not_ready:
                  value:
                    error: not_ready
                    message: dependencies not ready
                    details:
                      db: { ok: false }
                      redis: { ok: true }

  /metrics:
    get:
      tags: [Ops]
      summary: Prometheus metrics
      description: Exposes Prometheus/OpenMetrics text format.
      operationId: getMetrics
      servers:
        - url: http://localhost:8081
      responses:
        '200':
          description: Metrics stream (text)
          content:
            text/plain:
              schema:
                type: string
              examples:
                snippet:
                  value: |
                    # HELP http_requests_total Total number of HTTP requests
                    # TYPE http_requests_total counter
                    http_requests_total{method="GET",route="GET /cargo-agent/v1/health-check",status="200"} 42

  /users/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user with username and password and returns a JWT token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              sample:
                value:
                  username: demo
                  password: DemoPass123!
      responses:
        '200':
          description: Login successful
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginSuccessResponse' }
              examples:
                ok:
                  value:
                    message: Login successful
                    data:
                      token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Invalid request payload or validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes (blacklists) the current JWT until its expiry. Requires a valid Bearer token.
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
              examples:
                ok:
                  value:
                    message: Logout successful
                    data: null
        '400':
          description: Invalid/malformed Authorization header
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_auth_header:
                  value:
                    error: invalid_auth_header
                    message: Invalid Authorization header
                    details: null
        '401':
          description: Unauthorized (expired/revoked/invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                token_revoked:
                  value:
                    error: token_revoked
                    message: Token has been revoked
                    details: null
                token_expired:
                  value:
                    error: token_expired
                    message: Token has expired
                    details: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error while revoking token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/signup:
    post:
      tags: [Auth]
      summary: Sign up
      description: Creates a new user account.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
            examples:
              sample:
                value:
                  username: johndoe
                  email: john.doe@example.com
                  password: StrongPass!23
                  name: John Doe
                  country: RS
                  city: Nis
                  legal_address: "Some street 10, 18000 Nis"
                  vat_number: "RS123456789"
                  language: en
      responses:
        '201':
          description: User created successfully
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserSuccessResponse' }
              examples:
                created:
                  value:
                    message: User created successfully
                    data:
                      id: 101
                      username: johndoe
                      email: john.doe@example.com
                      name: John Doe
                      country: RS
                      city: Nis
                      legal_address: "Some street 10, 18000 Nis"
                      vat_number: "RS123456789"
                      status: active
                      language: en
                      created: "2025-08-29T09:30:00Z"
                      updated: "2025-08-29T09:30:00Z"
        '400':
          description: Invalid request payload or validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_payload:
                  value:
                    error: invalid_payload
                    message: Invalid request payload
                    details: null
                bad_request:
                  value:
                    error: bad_request
                    message: "username is required"
                    details: null
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                username_exists:
                  value:
                    error: username_exists
                    message: Username already exists
                    details: null
                email_exists:
                  value:
                    error: email_exists
                    message: Email already exists
                    details: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Internal error while creating user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                transaction_start_failed:
                  value:
                    error: transaction_start_failed
                    message: Failed to start transaction
                    details: null
                password_hash_failed:
                  value:
                    error: password_hash_failed
                    message: Failed to hash password
                    details: null
                user_creation_failed:
                  value:
                    error: user_creation_failed
                    message: Failed to create user
                    details: null
                transaction_commit_failed:
                  value:
                    error: transaction_commit_failed
                    message: Failed to commit transaction
                    details: null

  /users/verify-email:
    get:
      tags: [Auth]
      summary: Verify email
      description: Confirms a user's email using a verification token. This endpoint is public.
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          description: Verification token from the email link
          schema: { type: string }
      responses:
        '200':
          description: Email verified
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
              examples:
                ok:
                  value:
                    message: Email verified successfully
                    data: null
        '400':
          description: Invalid or missing token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_token:
                  value:
                    error: invalid_token
                    message: Token is required
                    details: null
        '410':
          description: Token expired (gone)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                token_expired:
                  value:
                    error: token_expired
                    message: Token has expired
                    details: null
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server or database error during verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/password-reset/request:
    post:
      tags: [Auth]
      summary: Start password reset
      description: Sends a password reset email if the account exists. Response is always 200 for privacy.
      operationId: passwordResetRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
            examples:
              sample:
                value:
                  username_or_email: demo@example.com
      responses:
        '200':
          description: A generic response; if the account exists, an email is sent.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
              examples:
                ok:
                  value:
                    message: If that account exists, an email has been sent
                    data: null
        '400':
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error while creating reset token or sending email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Confirm password reset
      description: Resets the password using a valid token.
      operationId: passwordResetConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirmRequest' }
            examples:
              sample:
                value:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  new_password: NewStrong!234
      responses:
        '200':
          description: Password successfully reset
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
              examples:
                ok:
                  value:
                    message: Password reset successful
                    data: null
        '400':
          description: Invalid token or weak password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '410':
          description: Token expired (gone)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error while resetting password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me:
    get:
      tags: [User]
      summary: Get current user's profile
      description: Returns the authenticated user's profile. Requires a valid JWT token.
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileSuccessResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

    patch:
      tags: [User]
      summary: Update current user's profile
      description: Partially updates the authenticated user's profile. At least one field must be provided. Requires a valid JWT token.
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserProfileRequest' }
      responses:
        '200':
          description: User profile updated successfully
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfileSuccessResponse' }
        '400':
          description: Invalid payload, validation failed, or no fields to update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Update failed (database or server error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/me/password:
    put:
      tags: [User]
      summary: Change current user's password
      description: |
        Updates the authenticated user's password. The request must include the current
        password and a new password that satisfies the password policy.
        Requires a valid JWT token.
      operationId: changeUserPassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            examples:
              sample:
                value:
                  old_password: DemoPass123!
                  new_password: NewStrong!234
      responses:
        '200':
          description: Password updated successfully
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
              examples:
                ok:
                  value:
                    message: Password updated successfully
                    data: null
        '400':
          description: Invalid payload or password policy violation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                bad_request:
                  value:
                    error: bad_request
                    message: new password must be at least 8 characters long
                    details: null
                invalid_new_password:
                  value:
                    error: invalid_new_password
                    message: New password must be different from the old password
                    details: null
        '401':
          description: Unauthorized (missing/invalid token) or old password incorrect
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_old_password:
                  value:
                    error: invalid_old_password
                    message: Old password is incorrect
                    details: null
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Server error while changing password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}:
    delete:
      tags: [User]
      summary: Soft delete user
      description: Marks the user as deleted (soft delete via status) and updates the timestamp.
      operationId: deleteUser
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: User ID (integer)
          schema: { type: integer, format: int32 }
          example: 42
      responses:
        '200':
          description: User deleted successfully
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteUserSuccessResponse' }
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          description: Delete failed (database or server error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /countries:
    get:
      tags: [Country]
      summary: List countries
      description: Returns a list of countries. Requires a valid JWT token.
      operationId: listCountries
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Countries loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountriesListSuccessResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Countries not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /countries/{id}:
    get:
      tags: [Country]
      summary: Get country by ID
      description: Returns a single country by its ID. Requires a valid JWT token.
      operationId: getCountryById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Country ID (integer)
          schema: { type: integer, format: int32 }
          example: 1
      responses:
        '200':
          description: Country loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountrySuccessResponse' }
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Country not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /countries/name/{name}:
    get:
      tags: [Country]
      summary: Get country by name
      description: Returns a single country by its name. Requires a valid JWT token.
      operationId: getCountryByName
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Country name (string)
          schema: { type: string }
          example: Serbia
      responses:
        '200':
          description: Country loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CountrySuccessResponse' }
        '400':
          description: Invalid name (empty or only whitespace)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_name:
                  value:
                    error: invalid_name
                    message: Country name cannot be empty
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Country not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /countries/id/{id}/cities:
    get:
      tags: [Country, City]
      summary: List cities by country ID
      description: Returns a list of cities for the given country ID. Requires a valid JWT token.
      operationId: listCitiesByCountryId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Country ID (integer)
          schema: { type: integer, format: int32 }
          example: 1
      responses:
        '200':
          description: Cities loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitiesListByCountrySuccessResponse' }
        '400':
          description: Invalid ID (must be an integer)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cities not found for the specified ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /countries/name/{name}/cities:
    get:
      tags: [Country, City]
      summary: List cities by country name
      description: Returns a list of cities for the given country name. Requires a valid JWT token.
      operationId: listCitiesByCountryName
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          description: Country name (string)
          schema: { type: string }
          example: Serbia
      responses:
        '200':
          description: Cities loaded
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/XRateLimitRemaining' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitiesListByCountrySuccessResponse' }
        '400':
          description: Invalid name (must be a non-empty string)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_name:
                  value:
                    error: invalid_name
                    message: Country name cannot be empty
                    details: null
        '401':
          description: Unauthorized (missing or invalid token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cities not found for the specified country name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /cargo-offers:
    get:
      tags: [CargoOffers]
      summary: List cargo offers
      description: Returns a paginated list of cargo offers with optional filters.
      operationId: listCargoOffers
